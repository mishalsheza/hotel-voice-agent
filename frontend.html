<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Concierge — Test Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #1B1A18;
    --panel: #221F1B;
    --ivory: #F6F1E7;
    --brass: #B08D57;
    --brass-bright: #C9A876;
    --green: #3B5D48;
    --green-bright: #4C7A5C;
    --red: #A63D40;
    --red-bright: #C24A4D;
    --muted: #8C8477;
    --hairline: rgba(246, 241, 231, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(176,141,87,0.10), transparent),
      var(--ground);
    color: var(--ivory);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .panel {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    padding: 40px 36px 32px;
  }

  .eyebrow {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 28px;
    color: var(--ivory);
  }

  .lamp-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    margin-bottom: 24px;
  }

  .lamp {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .lamp.ready { background: var(--brass-bright); box-shadow: 0 0 8px rgba(201,168,118,0.6); }
  .lamp.live { background: var(--green-bright); box-shadow: 0 0 8px rgba(76,122,92,0.7); animation: pulse 1.6s ease-in-out infinite; }
  .lamp.error { background: var(--red-bright); box-shadow: 0 0 8px rgba(194,74,77,0.6); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  #statusText {
    font-size: 14px;
    color: var(--ivory);
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .number-field {
    width: 100%;
    padding: 14px 16px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    color: var(--ivory);
    font-family: 'Inter', monospace;
    font-size: 17px;
    letter-spacing: 0.02em;
    margin-bottom: 28px;
    transition: border-color 0.2s;
  }
  .number-field:focus {
    outline: none;
    border-color: var(--brass);
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 22px;
  }

  .dial-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.2s;
    flex-shrink: 0;
  }
  .dial-btn:active:not(:disabled) { transform: scale(0.94); }
  .dial-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .dial-btn svg { width: 24px; height: 24px; }

  #callBtn { background: var(--green); }
  #callBtn:hover:not(:disabled) { background: var(--green-bright); }

  #hangupBtn { background: var(--red); }
  #hangupBtn:hover:not(:disabled) { background: var(--red-bright); }

  .btn-label {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  .messages {
    min-height: 20px;
    text-align: center;
    font-size: 13px;
    margin-top: 4px;
  }
  .messages.err { color: var(--red-bright); }
  .messages.info { color: var(--brass-bright); }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--hairline);
  }

  .tickets-btn {
    width: 100%;
    margin-top: 14px;
    padding: 12px 16px;
    background: rgba(176,141,87,0.08);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    color: var(--brass-bright);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .tickets-btn:hover { background: rgba(176,141,87,0.14); border-color: var(--brass); }

  .tickets-drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 360px;
    max-width: 90vw;
    background: var(--panel);
    border-left: 1px solid var(--hairline);
    padding: 28px 24px;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    overflow-y: auto;
    z-index: 10;
  }
  .tickets-drawer.open { transform: translateX(0); }

  .drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .drawer-header h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 20px;
    margin: 0;
    color: var(--ivory);
  }
  .drawer-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .drawer-close:hover { color: var(--ivory); }

  .ticket-count {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .ticket-card {
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .ticket-card .row1 {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .ticket-card .item {
    font-size: 14px;
    color: var(--ivory);
    font-weight: 500;
  }
  .ticket-card .room {
    font-size: 12px;
    color: var(--brass-bright);
    font-family: monospace;
  }
  .ticket-card .desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .ticket-card .meta {
    display: flex;
    gap: 8px;
    font-size: 11px;
  }
  .pill {
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
  }
  .pill.high { color: var(--red-bright); background: rgba(166,61,64,0.15); }
  .pill.medium { color: var(--brass-bright); background: rgba(176,141,87,0.15); }
  .pill.low { color: var(--green-bright); background: rgba(59,93,72,0.15); }

  .drawer-empty, .drawer-loading, .drawer-error {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 40px 0;
  }
  .drawer-error { color: var(--red-bright); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 9;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<div class="panel">
  <p class="eyebrow">Internal test line</p>
  <h1>Hotel Concierge</h1>

  <div class="lamp-row">
    <div class="lamp" id="lamp"></div>
    <div id="statusText">Initializing…</div>
  </div>

  <label for="phoneInput">Call from your browser to</label>
  <input type="text" id="phoneInput" class="number-field" placeholder="+1XXXXXXXXXX" value="+17372508034">

  <div class="controls">
    <div>
      <button id="callBtn" class="dial-btn" disabled title="Call">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F6F1E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </button>
      <div class="btn-label">Call</div>
    </div>
    <div>
      <button id="hangupBtn" class="dial-btn" disabled title="Hang up">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F6F1E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.76"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M9.5 8.5c-.402-.907-.637-1.85-.7-2.81A2 2 0 0 0 6.79 3.73H3.79a2 2 0 0 0-2 2.18c.12 1.13.35 2.25.68 3.34"/>
        </svg>
      </button>
      <div class="btn-label">Hang up</div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <button class="tickets-btn" id="ticketsBtn">View tickets</button>

  <p class="hint">Registered devices connect through your Twilio number and route to the AI concierge.</p>
</div>

<div class="overlay" id="overlay"></div>
<div class="tickets-drawer" id="ticketsDrawer">
  <div class="drawer-header">
    <h2>Tickets</h2>
    <button class="drawer-close" id="drawerClose">&times;</button>
  </div>
  <div class="ticket-count" id="ticketCount"></div>
  <div id="ticketsList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.13.0/dist/twilio.min.js"></script>
<script>
  let device = null;
  let connection = null;
  let isCallActive = false;

  const callBtn = document.getElementById('callBtn');
  const hangupBtn = document.getElementById('hangupBtn');
  const lamp = document.getElementById('lamp');
  const statusText = document.getElementById('statusText');
  const messages = document.getElementById('messages');
  const phoneInput = document.getElementById('phoneInput');

  let msgTimeout = null;
  function showMessage(text, kind) {
    messages.textContent = text;
    messages.className = 'messages ' + kind;
    clearTimeout(msgTimeout);
    msgTimeout = setTimeout(() => { messages.textContent = ''; messages.className = 'messages'; }, 5000);
  }

  function setLamp(state, text) {
    lamp.className = 'lamp ' + state;
    statusText.textContent = text;
  }

  async function initTwilio() {
    setLamp('', 'Initializing…');

    try {
      const response = await fetch('/dialer/token');
      const data = await response.json();

      if (data.error) {
        setLamp('error', 'Token error');
        showMessage(data.error, 'err');
        return;
      }

      device = new Twilio.Device(data.token, {
        logLevel: 1,
        codecPreferences: ['opus', 'pcmu'],
      });

      device.on('registered', () => {
        setLamp('ready', 'Ready to call');
        callBtn.disabled = false;
        showMessage('Device registered. Enter a number and call.', 'info');
      });

      device.on('error', (error) => {
        console.error('Device error:', error);
        setLamp('error', 'Device error');
        showMessage(error.message, 'err');
      });

      device.on('incoming', (call) => {
        call.reject();
      });

      device.register();

    } catch (err) {
      console.error('Init error:', err);
      setLamp('error', 'Connection failed');
      showMessage('Failed to initialize: ' + err.message, 'err');
    }
  }

  async function makeCall() {
    if (!device) {
      showMessage('Device not initialized', 'err');
      return;
    }

    let phoneNumber = phoneInput.value.trim();
    if (!phoneNumber) {
      showMessage('Enter a phone number', 'err');
      return;
    }
    if (!phoneNumber.startsWith('+')) {
      phoneNumber = '+1' + phoneNumber;
    }

    setLamp('', 'Calling ' + phoneNumber + '…');
    callBtn.disabled = true;

    try {
      connection = await device.connect({ params: { To: phoneNumber } });

      isCallActive = true;
      hangupBtn.disabled = false;
      callBtn.disabled = true;
      setLamp('live', 'Connected to ' + phoneNumber);
      showMessage('Call connected. Speak to the concierge.', 'info');

      connection.on('disconnect', () => {
        isCallActive = false;
        hangupBtn.disabled = true;
        callBtn.disabled = false;
        setLamp('ready', 'Ready to call');
        showMessage('Call ended', 'info');
      });

      connection.on('error', (error) => {
        console.error('Call error:', error);
        showMessage(error.message, 'err');
        isCallActive = false;
        hangupBtn.disabled = true;
        callBtn.disabled = false;
        setLamp('error', 'Call failed');
      });

    } catch (err) {
      console.error('Call error:', err);
      showMessage('Call failed: ' + err.message, 'err');
      setLamp('error', 'Call failed');
      callBtn.disabled = false;
      hangupBtn.disabled = true;
    }
  }

  function hangUp() {
    if (connection && isCallActive) {
      connection.disconnect();
      isCallActive = false;
      hangupBtn.disabled = true;
      callBtn.disabled = false;
      setLamp('', 'Hanging up…');
    }
  }

  callBtn.addEventListener('click', makeCall);
  hangupBtn.addEventListener('click', hangUp);
  phoneInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') makeCall();
  });

  document.addEventListener('DOMContentLoaded', initTwilio);

  // --- Tickets drawer ---
  const ticketsBtn = document.getElementById('ticketsBtn');
  const ticketsDrawer = document.getElementById('ticketsDrawer');
  const overlay = document.getElementById('overlay');
  const drawerClose = document.getElementById('drawerClose');
  const ticketsList = document.getElementById('ticketsList');
  const ticketCount = document.getElementById('ticketCount');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function renderTickets(tickets) {
    if (!tickets || tickets.length === 0) {
      ticketCount.textContent = '';
      ticketsList.innerHTML = '<div class="drawer-empty">No tickets yet.</div>';
      return;
    }

    ticketCount.textContent = tickets.length + (tickets.length === 1 ? ' ticket' : ' tickets');

    // Most recent first, if a sortable timestamp is present.
    const sorted = [...tickets].sort((a, b) => {
      const at = a.created_at || '';
      const bt = b.created_at || '';
      return bt.localeCompare(at);
    });

    ticketsList.innerHTML = sorted.map(t => {
      const item = escapeHtml(t.item || t.request_type || 'Request');
      const room = escapeHtml(t.room != null ? 'Room ' + t.room : '');
      const qty = t.quantity && t.quantity > 1 ? (t.quantity + '× ') : '';
      const desc = escapeHtml(t.description || '');
      const priority = (t.priority || 'medium').toLowerCase();
      const status = escapeHtml(t.status || 'open');
      return `
        <div class="ticket-card">
          <div class="row1">
            <span class="item">${qty}${item}</span>
            <span class="room">${room}</span>
          </div>
          ${desc ? `<div class="desc">${desc}</div>` : ''}
          <div class="meta">
            <span class="pill ${priority}">${escapeHtml(priority)}</span>
            <span class="pill">${status}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  async function loadTickets() {
    ticketCount.textContent = '';
    ticketsList.innerHTML = '<div class="drawer-loading">Loading tickets…</div>';

    try {
      const res = await fetch('/tickets');
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const data = await res.json();
      renderTickets(data.tickets);
    } catch (err) {
      console.error('Failed to load tickets:', err);
      ticketsList.innerHTML = '<div class="drawer-error">Could not load tickets. ' + escapeHtml(err.message) + '</div>';
    }
  }

  function openDrawer() {
    ticketsDrawer.classList.add('open');
    overlay.classList.add('open');
    loadTickets();
  }

  function closeDrawer() {
    ticketsDrawer.classList.remove('open');
    overlay.classList.remove('open');
  }

  ticketsBtn.addEventListener('click', openDrawer);
  drawerClose.addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);
</script>

</body>
</html>
